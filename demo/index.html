<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TradeRead Charts — demo</title>
<style>
  :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --line: rgba(139,148,158,0.25); }
  body.light { --bg: #ffffff; --fg: #131722; --muted: #5f6b7c; --line: rgba(42,46,57,0.25); }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px -apple-system, "Segoe UI", sans-serif; }
  header { padding: 12px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0 8px 0 0; }
  .grp { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  button { border: none; background: none; color: var(--muted); font: 700 12px inherit; padding: 5px 9px; border-radius: 7px; cursor: pointer; }
  button.on { background: rgba(99,102,241,0.25); color: var(--fg); }
  #chart { width: 100%; height: 640px; }
  #readout { padding: 8px 18px; color: var(--muted); font: 12px ui-monospace, Menlo, monospace; min-height: 18px; }
  .hint { padding: 0 18px 10px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>TradeRead Charts v0.16</h1>
  <div class="grp" id="tfs"></div>
  <div class="grp"><button id="tDark" class="on">Dark</button><button id="tLight">Light</button></div>
</header>
<p class="hint">Uneltele de desen, indicatorii (≡), tipul de chart și camera sunt ÎN bibliotecă — pagina asta doar creează chartul.</p>
<div id="chart"></div>
<div id="readout"></div>
<script src="../src/traderead-charts.js"></script>
<script>
  var TFS = [["1m",60],["2m",120],["3m",180],["5m",300],["15m",900],["30m",1800],["1H",3600],["4H",14400],["1D",86400],["1W",604800],["1M","1M"],["1Y","1Y"]];
  var PRO_TFS = { "2m": 1, "3m": 1, "1M": 1, "1Y": 1 };   // marcate vizual ca Pro in demo
  var tfSec = 3600, bars = [];
  function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var v = Math.imul(seed ^ seed >>> 15, 1 | seed); v = v + Math.imul(v ^ v >>> 7, 61 | v) ^ v; return ((v ^ v >>> 14) >>> 0) / 4294967296; }; }
  function genBars() {
    var rnd = mulberry(42), out = [];
    var sec = typeof tfSec === "number" ? tfSec : 86400 * (tfSec === "1M" ? 30 : 365);
    var t = Math.floor(Date.now() / 1000 / sec) * sec - 600 * sec;
    var px = 65000, amp = 260 * Math.sqrt(sec / 3600);
    for (var i = 0; i < 600; i++) {
      var open = px, close = px + (rnd() - 0.485) * amp;
      var high = Math.max(open, close) + rnd() * amp * 0.55;
      var low = Math.min(open, close) - rnd() * amp * 0.55;
      out.push({ time: t + i * sec, open: open, high: high, low: low, close: close, volume: 50 + rnd() * 400 });
      px = close;
    }
    return out;
  }

  // ── Adaptor Binance (gratuit, fara cheie) pentru selectorul de tickere:
  //    biblioteca da UI-ul, sursa de date e pluggable — pe traderead.ai va fi
  //    API-ul nostru (Alpaca + Binance), aici e exemplul functional public.
  var NAMES = { BTC: "Bitcoin", ETH: "Ethereum", SOL: "Solana", XRP: "XRP", DOGE: "Dogecoin", ADA: "Cardano",
    LINK: "Chainlink", AVAX: "Avalanche", DOT: "Polkadot", NEAR: "NEAR Protocol", ATOM: "Cosmos", UNI: "Uniswap",
    LTC: "Litecoin", BCH: "Bitcoin Cash", TRX: "TRON", SHIB: "Shiba Inu", PEPE: "Pepe", WIF: "dogwifhat",
    APT: "Aptos", ARB: "Arbitrum", OP: "Optimism", INJ: "Injective", TIA: "Celestia", SEI: "Sei", FET: "Fetch.ai",
    RENDER: "Render", TAO: "Bittensor", FIL: "Filecoin", HBAR: "Hedera", SUI: "Sui", TON: "Toncoin", ETC: "Ethereum Classic" };
  var SYMBOLS = null;
  function loadSymbols(cb) {
    if (SYMBOLS) return cb(SYMBOLS);
    fetch("https://api.binance.com/api/v3/exchangeInfo?permissions=SPOT")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        SYMBOLS = (d.symbols || [])
          .filter(function (x) { return x.status === "TRADING" && x.quoteAsset === "USDT"; })
          .map(function (x) { return { symbol: x.symbol, display: x.baseAsset, name: NAMES[x.baseAsset] || "", exchange: "Binance" }; });
        cb(SYMBOLS);
      })
      .catch(function () { cb([]); });
  }
  // native unde exista; 2m se agrega din 1m, 1Y din 1M — TRCharts.resample
  var TF_BINANCE = { 60: "1m", 180: "3m", 300: "5m", 900: "15m", 1800: "30m", 3600: "1h", 14400: "4h", 86400: "1d", 604800: "1w", "1M": "1M" };
  var TF_DERIVED = { 120: { from: "1m", spec: 120 }, "1Y": { from: "1M", spec: "1Y" } };
  var liveSymbol = null;   // null = datele sintetice
  function loadReal(item) {
    var drv = TF_DERIVED[tfSec];
    var interval = drv ? drv.from : (TF_BINANCE[tfSec] || "1h");
    var limit = drv ? 1000 : 600;
    fetch("https://api.binance.com/api/v3/klines?symbol=" + item.symbol + "&interval=" + interval + "&limit=" + limit)
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        bars = rows.map(function (k) {
          return { time: Math.floor(k[0] / 1000), open: +k[1], high: +k[2], low: +k[3], close: +k[4], volume: +k[5] };
        });
        if (drv) bars = TRCharts.resample(bars, drv.spec);
        liveSymbol = item;
        chart.setData(bars);
        chart.setPersistKey("trc-demo:" + item.symbol + ":" + tfSec);
        chart.setSymbolInfo({ ticker: item.display, title: item.name || item.symbol, tf: tfName() });
        chart.setMarkers([]);
      })
      .catch(function (e) { console.error("klines", e); });
  }
  function tfName() { return TFS.filter(function (t) { return t[1] === tfSec; })[0][0]; }

  var chart = TRCharts.createChart(document.getElementById("chart"), {
    symbolSearch: {
      search: function (q, cb) {
        loadSymbols(function (list) {
          var s = q.toUpperCase();
          cb(list.filter(function (it) {
            return it.display.indexOf(s) === 0 || it.symbol.indexOf(s) === 0 ||
              (it.name && it.name.toUpperCase().indexOf(s) >= 0);
          }).slice(0, 30));
        });
      },
      onSelect: loadReal,
    },
  });
  function load() {
    bars = genBars();
    chart.setData(bars);
    chart.setPersistKey("trc-demo:" + tfSec);
    chart.setSymbolInfo({ ticker: "DEMO", title: "Synthetic random walk — click to search", tf: tfName() });
    // fara nimic salvat: pornim cu setul standard al widgetului de productie
    if (!chart.getIndicators().length && !localStorage.getItem("trc-demo:" + tfSec + ":ind")) {
      chart.addIndicator("ema", { p: 9 }, "#00d97e");
      chart.addIndicator("ema", { p: 20 }, "#f0b429");
      chart.addIndicator("ema", { p: 50 }, "#58a6ff");
      chart.addIndicator("ema", { p: 200 }, "#f85149");
      chart.addIndicator("rsi", { p: 14 }, "#c084fc");
      chart.addIndicator("macd");
    }
  }

  var tfBar = document.getElementById("tfs");
  TFS.forEach(function (tf) {
    var b = document.createElement("button");
    b.textContent = tf[0];
    if (PRO_TFS[tf[0]]) { b.textContent = tf[0] + "★"; b.title = "Pro timeframe"; }
    if (tf[1] === tfSec) b.className = "on";
    b.addEventListener("click", function () {
      tfSec = tf[1];
      tfBar.querySelectorAll("button").forEach(function (x) { x.className = x === b ? "on" : ""; });
      if (liveSymbol) loadReal(liveSymbol);
      else load();
    });
    tfBar.appendChild(b);
  });

  document.getElementById("tDark").addEventListener("click", function () {
    document.body.classList.remove("light");
    this.className = "on"; document.getElementById("tLight").className = "";
    chart.applyOptions({ background: "#0d1117", textColor: "#8b949e", gridColor: "rgba(139,148,158,0.12)",
      separatorColor: "rgba(139,148,158,0.25)", crosshair: "rgba(139,148,158,0.45)",
      tagBg: "#2a2e39", tagText: "#e6edf3", volumeUp: "rgba(0,217,126,0.35)", volumeDown: "rgba(248,81,73,0.35)",
      upColor: "#00d97e", downColor: "#f85149", wickUp: "#00d97e", wickDown: "#f85149" });
  });
  document.getElementById("tLight").addEventListener("click", function () {
    document.body.classList.add("light");
    this.className = "on"; document.getElementById("tDark").className = "";
    chart.applyOptions(TRCharts.themes.light);
  });

  chart.onCrosshair(function (info) {
    document.getElementById("readout").textContent = info
      ? "bar " + info.index + " · O " + info.bar.open.toFixed(0) + " H " + info.bar.high.toFixed(0) +
        " L " + info.bar.low.toFixed(0) + " C " + info.bar.close.toFixed(0) + " · cursor " + info.paneValue.toFixed(2)
      : "";
  });
  // date reale: ultimele 2 candele la fiecare 5s — update() ruleaza rollul
  setInterval(function () {
    if (!liveSymbol) return;
    fetch("https://api.binance.com/api/v3/klines?symbol=" + liveSymbol.symbol + "&interval=" + (TF_DERIVED[tfSec] ? TF_DERIVED[tfSec].from : (TF_BINANCE[tfSec] || "1h")) + "&limit=2")
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        rows.forEach(function (k) {
          chart.update({ time: Math.floor(k[0] / 1000), open: +k[1], high: +k[2], low: +k[3], close: +k[4], volume: +k[5] });
        });
      }).catch(function () {});
  }, 5000);

  var rndLive = mulberry(7);
  setInterval(function () {
    if (!bars.length || liveSymbol) return;
    var b = Object.assign({}, bars[bars.length - 1]);
    b.close += (rndLive() - 0.5) * 60 * Math.sqrt((typeof tfSec === "number" ? tfSec : 86400) / 3600);
    b.high = Math.max(b.high, b.close); b.low = Math.min(b.low, b.close);
    bars[bars.length - 1] = b;
    chart.update(b);
  }, 900);

  load();
  // markere exemplu: intrare/iesire
  if (bars.length > 100) chart.setMarkers([
    { time: bars[bars.length - 60].time, position: "below", shape: "arrowUp", color: "#00d97e", text: "BUY" },
    { time: bars[bars.length - 25].time, position: "above", shape: "arrowDown", color: "#f85149", text: "SELL" },
  ]);
</script>
</body>
</html>
